# Streamlit-Konfiguration
[theme]
base = "light"
primaryColor = "#0e639c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"

[server]
headless = true
runOnSave = false
# Erlaubt das Ausliefern von frontend/static/ unter /app/static/*.
# Wird für version.txt gebraucht: der Deploy-Stand muss von außen prüfbar
# sein, ohne sich durch den Passwortschutz zu klicken.
enableStaticServing = true
