name: Daten-Sync

# Hält die Wissensbasis aktuell, ohne dass jemand dran denken muss — und hält
# nebenbei die Streamlit-App wach (Community Cloud schläfert nach 7 Tagen
# Inaktivität ein und löscht länger inaktive Apps).
on:
  schedule:
    - cron: "0 5 * * *"   # täglich 05:00 UTC (07:00 MESZ)
  workflow_dispatch:
    inputs:
      news_days:
        description: "Zeitfenster für die Web-News-Suche (Tage)"
        default: "30"

# actions: write braucht der Keepalive-Schritt unten.
permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync ausführen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DGX_BASE_URL: ${{ secrets.DGX_BASE_URL }}
          DGX_API_KEY: ${{ secrets.DGX_API_KEY }}
          DGX_CHAT_MODEL: ${{ secrets.DGX_CHAT_MODEL }}
          DGX_EMBED_MODEL: ${{ secrets.DGX_EMBED_MODEL }}
          DGX_EMBED_DIM: "768"
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WEB_SEARCH_PROVIDER: auto
          HOCKEYDATA_API_KEY: ${{ secrets.HOCKEYDATA_API_KEY }}
          HOCKEYDATA_REFERER: deb-online.live
        run: python3 scripts/sync_daily.py --news-days ${{ github.event.inputs.news_days || 30 }}

      # GitHub schaltet Cron-Workflows nach 60 Tagen ohne Commit ab — so geschehen
      # am 08.10.2026, danach blieb die Wissensbasis stehen. Das erneute
      # Einschalten über die API setzt die Frist zurück. Läuft auch, wenn der
      # Sync rot war: gerade dann soll er morgen wieder laufen.
      - name: Workflow wachhalten
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"

      - name: Streamlit-App wachhalten
        # Auch nach rotem Sync — sonst schläft die App ein, solange er rot bleibt.
        if: always()
        continue-on-error: true
        # Ohne Cookie-Jar endet der Aufruf bei HTTP 303 auf der Auth-Weiterleitung
        # der Streamlit-Edge — die App selbst wird dabei nie angefasst. Erst der
        # Handshake mit Cookies lädt die Seite wirklich (HTTP 200).
        run: |
          curl -sSL --max-redirs 12 -m 90 -c /tmp/cj.txt -b /tmp/cj.txt \
               -A 'Mozilla/5.0 (compatible; falken-kb-keepalive/1.0)' \
               -o /dev/null -w 'app HTTP %{http_code}\n' https://falkenapp.streamlit.app/
